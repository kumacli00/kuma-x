<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>今日の引用候補</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
  :root{
    --paper:#F7F8FA; --surface:#FFFFFF; --sunken:#EEF1F5;
    --ink:#151A22; --muted:#667081; --faint:#8C94A1;
    --line:#DEE3EA; --line-soft:#EBEEF3;
    --accent:#23666A; --accent-ink:#1B5155; --accent-bg:#E4EFEF;
    --gold:#8A6420; --gold-bg:#F6EFDF;
    --shadow:0 1px 2px rgba(21,26,34,.05),0 6px 20px rgba(21,26,34,.06);
    --display:"Shippori Mincho","Hiragino Mincho ProN",serif;
    --body:"Zen Kaku Gothic New","Hiragino Sans",system-ui,sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#0F131A; --surface:#161B24; --sunken:#1B212B;
      --ink:#E7EAF0; --muted:#9BA4B2; --faint:#79828F;
      --line:#262E3A; --line-soft:#1E2530;
      --accent:#6FB5B5; --accent-ink:#8CC9C7; --accent-bg:#15282A;
      --gold:#D2A85C; --gold-bg:#2A2317;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.3);
    }
  }
  :root[data-theme="dark"]{
    --paper:#0F131A; --surface:#161B24; --sunken:#1B212B;
    --ink:#E7EAF0; --muted:#9BA4B2; --faint:#79828F;
    --line:#262E3A; --line-soft:#1E2530;
    --accent:#6FB5B5; --accent-ink:#8CC9C7; --accent-bg:#15282A;
    --gold:#D2A85C; --gold-bg:#2A2317;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:var(--body);font-size:16px;line-height:1.8;-webkit-font-smoothing:antialiased}
  .wrap{max-width:40rem;margin:0 auto;padding:2rem 1rem 5rem}

  header{margin-bottom:1.75rem}
  .eyebrow{font-family:var(--mono);font-size:.7rem;letter-spacing:.16em;
    text-transform:uppercase;color:var(--accent);margin:0 0 .5rem}
  h1{font-family:var(--display);font-weight:600;font-size:1.75rem;
    line-height:1.4;margin:0 0 .6rem}
  .sub{font-size:.88rem;color:var(--muted);margin:0}
  .tally{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:1rem;
    padding-top:1rem;border-top:1px solid var(--line)}
  .chip{font-family:var(--mono);font-size:.74rem;padding:.25rem .6rem;
    border-radius:999px;background:var(--sunken);color:var(--muted);
    font-variant-numeric:tabular-nums}
  .chip.on{background:var(--accent);color:#fff}
  :root[data-theme="dark"] .chip.on{color:#0F131A}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip.on{color:#0F131A}}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:6px;
    margin-bottom:1.25rem;overflow:hidden;box-shadow:var(--shadow);
    transition:opacity .2s}
  .card.done{border-color:var(--accent)}
  .card.skip{opacity:.45}

  .card-h{display:flex;align-items:center;gap:.6rem;padding:.7rem 1rem;
    border-bottom:1px solid var(--line-soft);background:var(--sunken)}
  .idx{font-family:var(--mono);font-size:.74rem;color:var(--accent);font-weight:600}
  .state{margin-left:auto;font-family:var(--mono);font-size:.7rem;
    padding:.15rem .5rem;border-radius:999px}
  .state.posted{background:var(--accent-bg);color:var(--accent-ink)}
  .state.skipped{background:var(--sunken);color:var(--faint)}
  .state.edited{background:var(--gold-bg);color:var(--gold)}

  .src{padding:.9rem 1rem;border-bottom:1px solid var(--line-soft)}
  .src-who{display:flex;flex-wrap:wrap;align-items:baseline;gap:.4rem;
    font-size:.82rem;color:var(--muted);margin-bottom:.4rem}
  .src-who b{color:var(--ink);font-weight:700;font-size:.86rem}
  .src-text{font-size:.92rem;line-height:1.75;margin:0 0 .6rem;
    color:var(--ink);white-space:pre-wrap;word-break:break-word}
  .stats{display:flex;flex-wrap:wrap;gap:.15rem .9rem;
    font-family:var(--mono);font-size:.75rem;color:var(--muted);
    font-variant-numeric:tabular-nums}
  .stats .rate{color:var(--accent-ink);font-weight:600}
  .src-link{display:inline-block;margin-top:.5rem;font-size:.78rem;
    color:var(--accent);text-decoration:none;border-bottom:1px solid currentColor}
  .src-link:hover,.src-link:focus-visible{opacity:.75}

  .draft{padding:.9rem 1rem 1rem}
  .draft-label{font-family:var(--mono);font-size:.7rem;letter-spacing:.1em;
    color:var(--faint);margin-bottom:.4rem;display:flex;align-items:center}
  .count{margin-left:auto;font-variant-numeric:tabular-nums}
  .count.over{color:#B4471F;font-weight:600}
  textarea{width:100%;min-height:6.5rem;padding:.75rem;border:1px solid var(--line);
    border-radius:4px;background:var(--paper);color:var(--ink);
    font-family:var(--body);font-size:.95rem;line-height:1.8;resize:vertical}
  textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}

  .actions{display:flex;gap:.5rem;margin-top:.75rem;flex-wrap:wrap}
  button{font-family:var(--body);font-size:.88rem;font-weight:700;
    padding:.7rem 1rem;border-radius:4px;border:1px solid transparent;
    cursor:pointer;min-height:2.9rem}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .btn-post{background:var(--accent);color:#fff;flex:1;min-width:9rem;
    display:inline-flex;align-items:center;justify-content:center;
    font-family:var(--body);font-size:.88rem;font-weight:700;
    padding:.7rem 1rem;border-radius:4px;min-height:2.9rem;
    text-decoration:none;cursor:pointer}
  :root[data-theme="dark"] .btn-post{color:#0F131A}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn-post{color:#0F131A}}
  .btn-copy{background:var(--surface);color:var(--accent-ink);
    border:1px solid var(--accent);display:inline-flex;align-items:center;
    justify-content:center;font-family:var(--body);font-size:.88rem;font-weight:700;
    padding:.7rem 1rem;border-radius:4px;min-height:2.9rem;
    text-decoration:none;cursor:pointer}
  .btn-skip{background:transparent;color:var(--faint);border-color:var(--line)}
  button:hover{opacity:.88}
  button[disabled]{opacity:.4;cursor:not-allowed}

  .note{margin-top:1.5rem;padding:1rem 1.15rem;background:var(--surface);
    border:1px solid var(--line);border-radius:6px;font-size:.83rem;
    line-height:1.75;color:var(--muted)}
  .note b{color:var(--ink)}
  .status{font-family:var(--mono);font-size:.74rem;color:var(--faint);
    margin-top:1rem;min-height:1.2rem}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}

  .more{display:block;width:100%;margin:.5rem 0 1.5rem;padding:.9rem;
    background:var(--surface);border:1px dashed var(--line);border-radius:6px;
    color:var(--accent);font-weight:700;font-size:.9rem;cursor:pointer}
  .more:hover{background:var(--accent-bg)}
  .tier{font-family:var(--mono);font-size:.66rem;letter-spacing:.06em;
    padding:.12rem .45rem;border-radius:3px;background:var(--accent-bg);
    color:var(--accent-ink);white-space:nowrap}
  .tier.stale{background:transparent;color:var(--muted);
    box-shadow:inset 0 0 0 1px currentColor;opacity:.75;margin-left:.35rem}
  .why{font-size:.82rem;color:var(--muted);line-height:1.7;margin:.35rem 0 0}
  .card-h{flex-wrap:wrap}

  .done-note{padding:1rem 1.15rem;background:var(--accent-bg);border-radius:6px;
    color:var(--accent-ink);font-size:.88rem;font-weight:700;text-align:center}

  /* すでに投稿した引用リポストの控え */
  .log{margin:1.4rem 0 0;border:1px solid var(--line);border-radius:6px;
    background:var(--surface);overflow:hidden}
  .log>summary{cursor:pointer;padding:.7rem .9rem;font-size:.82rem;font-weight:700;
    color:var(--muted);list-style:none}
  .log>summary::-webkit-details-marker{display:none}
  .log>summary::before{content:"▸ ";color:var(--accent-ink)}
  .log[open]>summary::before{content:"▾ "}
  .log-note{margin:0 .9rem .5rem;font-size:.74rem;color:var(--muted);line-height:1.6}
  .log-row{display:flex;gap:.6rem;align-items:baseline;flex-wrap:wrap;
    padding:.55rem .9rem;border-top:1px solid var(--line);
    text-decoration:none;color:inherit}
  .log-row:hover{background:var(--accent-bg)}
  .log-date{font-family:var(--mono);font-size:.7rem;color:var(--muted);flex:none}
  .log-text{flex:1 1 12rem;font-size:.8rem;line-height:1.6}
  .log-meta{font-family:var(--mono);font-size:.7rem;color:var(--muted);flex:none}
  .log-tag{display:inline-block;margin-right:.4rem;padding:.05rem .35rem;border-radius:3px;
    background:var(--accent-bg);color:var(--accent-ink);font-size:.66rem}
</style>
</head><body>

<script>(function () {
  const LIMIT = 140;
  const KEY = "kuma-x-state";
  const app = document.getElementById("app");
  const S = JSON.parse(document.getElementById("state").textContent);

  // 選択の記録は端末のブラウザに置く（サーバーを持たないため）
  let marks = {};
  try { marks = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch (e) { marks = {}; }
  const put = () => { try { localStorage.setItem(KEY, JSON.stringify(marks)); } catch (e) {} };

  let offset = 0;
  const esc = s => String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const n = v => Number(v || 0).toLocaleString("ja-JP");
  const st = it => marks[it.id] || "open";
  const compose = (it, text) =>
    "https://x.com/compose/post?text=" + encodeURIComponent((text || "").trim() + "\n" + it.url);

  function open_() { return S.items.filter(i => st(i) === "open"); }

  // すでに投稿した引用リポスト。X本体から突き合わせた実績なので、
  // 端末を変えても、ブラウザの記録が消えても残る。
  function postedLog() {
    const rows = S.posted || [];
    if (!rows.length) return "";
    return `
      <details class="log">
        <summary>すでに投稿した引用リポスト ${rows.length}本</summary>
        <p class="log-note">X本体から取得した実績です。同じ投稿を二度引用しないための控えです。</p>
        ${rows.map(r => `
          <a class="log-row" href="${esc(r.url)}" target="_blank" rel="noopener">
            <span class="log-date">${esc(r.date)}</span>
            <span class="log-text">${esc((r.text || "").slice(0, 60))}</span>
            <span class="log-meta">${r.fromSystem
              ? `<b class="log-tag">候補から</b>` : ""}表示 ${n(r.impressions)}</span>
          </a>`).join("")}
      </details>`;
  }

  function render() {
    const posted = S.items.filter(i => st(i) === "posted").length;
    const skipped = S.items.filter(i => st(i) === "skipped").length;
    const rest = open_();
    const shown = rest.slice(offset, offset + S.show);
    const more = rest.length - offset - shown.length;

    app.innerHTML = `
      <header>
        <p class="eyebrow">${esc(S.updated)} ／ @kumacli_mohri</p>
        <h1>今日の引用候補</h1>
        <p class="sub">引用元を見て、そのまま出すか直すかを決めてください。「Xで投稿する」を押すとXアプリが開き、本文と引用元が入った状態になります。そこで「ポスト」を押すと投稿されます。</p>
        <div class="tally">
          <span class="chip ${posted >= S.target ? "on" : ""}">投稿 ${posted} / ${S.target}</span>
          <span class="chip">見送り ${skipped}</span>
          <span class="chip">在庫 ${rest.length}</span>
        </div>
      </header>
      ${shown.length ? shown.map(card).join("")
        : '<div class="done-note">在庫がなくなりました。広報に候補の取り直しを依頼してください。</div>'}
      ${more > 0 ? `<button class="more" id="more">別の候補を見る（あと ${more} 件）</button>` : ""}
      ${offset > 0 ? `<button class="more" id="back">前の候補に戻る</button>` : ""}
      ${postedLog()}
      <div class="note">
        <b>反応率</b>は見た人のうち何%が動いたかです。表示回数が多くても反応率が低い投稿は、宣伝や身内向けのことが多く、引用しても伸びにくい傾向があります。<br><br>
        下書きは先生の過去の引用103本に合わせています（中央値105字・絵文字なし）。${LIMIT}字を超えると赤くなります。
      </div>
      <div class="status" id="status"></div>`;

    shown.forEach(bind);
    const mb = document.getElementById("more");
    if (mb) mb.onclick = () => { offset += S.show; render(); };
    const bb = document.getElementById("back");
    if (bb) bb.onclick = () => { offset = Math.max(0, offset - S.show); render(); };
  }

  function card(it) {
    return `
      <section class="card">
        <div class="card-h"><span class="tier">${esc(it.tierName || "")}</span>${
          it.stale ? `<span class="tier stale">やや古い投稿</span>` : ""}</div>
        ${it.why ? `<div class="src"><p class="why">${esc(it.why)}</p></div>` : ""}
        <div class="src">
          <div class="src-who">
            <b>@${esc(it.author)}</b>
            <span>${esc(it.authorName || "")}</span>
            <span>フォロワー ${n(it.followers)}</span>
            <span>${esc(it.date)}</span>
          </div>
          <p class="src-text">${esc(it.text)}</p>
          <div class="stats">
            <span>📊 ${n(it.impressions)}</span><span>👍 ${n(it.likes)}</span>
            <span>🔁 ${n(it.reposts)}</span><span>💬 ${n(it.replies)}</span>
            <span>🔖 ${n(it.bookmarks)}</span>
            <span class="rate">反応率 ${it.rate}%</span>
          </div>
          <a class="src-link" href="${esc(it.url)}">元の投稿をXで見る →</a>
        </div>
        <div class="draft">
          <div class="draft-label">下書き<span class="count" id="n${it.id}"></span></div>
          <textarea id="t${it.id}" aria-label="下書き">${esc(it.draft)}</textarea>
          <div class="actions">
            <a class="btn-post" id="p${it.id}" href="${esc(it.compose)}">Xで投稿する</a>
            <button class="btn-skip" id="k${it.id}">見送る</button>
          </div>
        </div>
      </section>`;
  }

  function bind(it) {
    const ta = document.getElementById("t" + it.id);
    const cnt = document.getElementById("n" + it.id);
    const link = document.getElementById("p" + it.id);
    const upd = () => {
      const len = [...ta.value].length;
      cnt.textContent = len + " / " + LIMIT + "字";
      cnt.classList.toggle("over", len > LIMIT);
      link.href = compose(it, ta.value);   // 編集した内容をリンクに反映
    };
    ta.addEventListener("input", upd); upd();

    link.onclick = () => { marks[it.id] = "posted"; put(); setTimeout(render, 400); };
    document.getElementById("k" + it.id).onclick = () => {
      marks[it.id] = "skipped"; put(); render();
    };
  }

  render();
})();
</script>
</body></html>
